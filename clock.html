<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clock · CalidPlanner</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root{--card:#EFE6DA;--ink:#3B322C;--muted:#8C7B6B;--accent:#C4A893;--line:#DCCFC0}
  body.blush{--card:#F3E2DD;--ink:#5A4440;--muted:#A88880;--accent:#CF968A;--line:#EAD6D0}
  body.sage{--card:#E6EADB;--ink:#3F4637;--muted:#7F8A74;--accent:#A3B18A;--line:#D9DECD}
  body.ivory{--card:#F4ECDF;--ink:#4A3F35;--muted:#9C8B78;--accent:#C9A96E;--line:#E2D6C6}
  body.rose{--card:#EBD3CA;--ink:#3B322C;--muted:#7A5F57;--accent:#CF968A;--line:transparent}
  body.night{--card:#3A332D;--ink:#F4ECDF;--muted:#BFAE98;--accent:#D8B97E;--line:#54493F}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{background:transparent;color:var(--ink);font-family:'Jost',system-ui,sans-serif;font-weight:300;display:flex;align-items:center;justify-content:center;overflow:hidden;font-variant-numeric:lining-nums;font-feature-settings:"lnum" 1}
  .card{width:calc(100vw - 8px);height:calc(100vh - 8px);max-width:640px;max-height:420px;background:var(--card);border-radius:min(6vw,22px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:min(2.2vh,10px);padding:min(6vw,28px);text-align:center;position:relative}
  .card::before{content:"";position:absolute;inset:min(2vw,9px);border:1px solid var(--line);border-radius:min(4.5vw,15px);pointer-events:none}
  .greet{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:clamp(15px,min(8vw,7vh),28px);line-height:1.15}
  .time{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:clamp(40px,min(26vw,26vh),120px);line-height:1;letter-spacing:-.01em;display:flex;align-items:baseline;gap:.12em}
  .ampm{font-family:'Jost',sans-serif;font-size:.2em;letter-spacing:.2em;color:var(--muted)}
  .rule{width:min(30vw,90px);height:1px;background:var(--accent)}
  .date{white-space:nowrap;font-size:clamp(10px,min(4vw,3.8vh),15px);letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
    .card.arch{width:100vw;height:100vh;max-width:none;max-height:none;border-radius:50vw 50vw 0 0;justify-content:flex-end;padding:0 8vw 14vh}
  .card.arch::before{display:none}
  .card.arch .time{font-size:clamp(36px,min(24vw,22vh),110px)}
  .sun{width:clamp(18px,min(8vw,8vh),32px);height:auto;color:var(--accent)}
</style>
</head>
<body>
<main class="card">
  <svg class="sun" id="icon" viewBox="0 0 32 32" aria-hidden="true"></svg>
  <p class="greet" id="greet">Good morning</p>
  <p class="time"><span id="time">9:41</span><span class="ampm" id="ampm"></span></p>
  <div class="rule"></div>
  <p class="date" id="date"></p>
</main>
<script>
  var q=new URLSearchParams(location.search);
  var th=(q.get('theme')||'mocha').toLowerCase(); if(['blush','sage','ivory','night','rose'].indexOf(th)>-1) document.body.className=th;
  var bg=(q.get('bg')||'').replace(/[^0-9a-fA-F]/g,''); if(bg.length===6||bg.length===3) document.body.style.background='#'+bg;
  if(q.get('frame')==='arch') document.querySelector('.card').classList.add('arch');
  var name=(q.get('name')||'').trim(), h24=q.get('format')==='24', lang=q.get('lang')==='es'?'es':'en';
  var G={en:['Good morning','Good afternoon','Good evening','Good night'],es:['Buenos días','Buenas tardes','Buenas noches','Buenas noches']}[lang];
  var SUN='<g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="16" cy="16" r="6"/><path d="M16 3v4M16 25v4M3 16h4M25 16h4M6.8 6.8l2.8 2.8M22.4 22.4l2.8 2.8M6.8 25.2l2.8-2.8M22.4 9.6l2.8-2.8"/></g>';
  var MOON='<path d="M21 4a12 12 0 1 0 7 19A10 10 0 0 1 21 4z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>';
  function pad(n){return n<10?'0'+n:''+n}
  function tick(){
    var d=new Date(), h=d.getHours(), m=d.getMinutes();
    var i=h>=5&&h<12?0:h>=12&&h<18?1:h>=18&&h<22?2:3;
    document.getElementById('greet').textContent=G[i]+(name?', '+name:'')+(i===0?' ☀︎':'');
    document.getElementById('icon').innerHTML=(i<2)?SUN:MOON;
    if(h24){document.getElementById('time').textContent=pad(h)+':'+pad(m);document.getElementById('ampm').textContent='';}
    else{document.getElementById('time').textContent=((h%12)||12)+':'+pad(m);document.getElementById('ampm').textContent=h<12?'AM':'PM';}
    document.getElementById('date').textContent=d.toLocaleDateString(lang==='es'?'es-ES':'en-US',{weekday:(innerWidth<300?'short':'long'),month:(innerWidth<300?'short':'long'),day:'numeric'});
  }
  tick(); setInterval(tick,1000);
</script>
</body>
</html>
