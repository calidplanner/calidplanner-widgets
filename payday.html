<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payday Countdown · CalidPlanner</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root{--card:#E6EADB;--ink:#3F4637;--muted:#7F8A74;--accent:#A3B18A;--track:#D3D9C6;--line:#D9DECD;--gold:#C9A96E}
  body.ivory{--card:#F4ECDF;--ink:#4A3F35;--muted:#9C8B78;--accent:#C9A96E;--track:#E6DACA;--line:#E2D6C6}
  body.pink{--card:#F6E4E0;--ink:#5A4440;--muted:#A88880;--accent:#E8A7B5;--track:#EBD3CA;--line:#EBCFCB}
  body.rose{--card:#EBD3CA;--ink:#3B322C;--muted:#7A5F57;--accent:#CF968A;--track:#DDBFB3;--line:transparent}
  body.night{--card:#3A332D;--ink:#F4ECDF;--muted:#BFAE98;--accent:#A3B18A;--track:#54493F;--line:#54493F}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{background:transparent;color:var(--ink);font-family:'Jost',system-ui,sans-serif;font-weight:300;display:flex;align-items:center;justify-content:center;font-variant-numeric:lining-nums;font-feature-settings:"lnum" 1}
  .card{width:calc(100vw - 8px);height:calc(100vh - 8px);max-width:640px;max-height:400px;background:var(--card);border-radius:min(6vw,22px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:min(2.2vh,10px);padding:min(6vw,28px);text-align:center;position:relative}
  .card::before{content:"";position:absolute;inset:min(2vw,9px);border:1px solid var(--line);border-radius:min(4.5vw,15px);pointer-events:none}
  .card.arch{width:100vw;height:100vh;max-width:none;max-height:none;border-radius:50vw 50vw 0 0;justify-content:flex-end;padding:0 9vw 13vh}
  .card.arch::before{display:none}
  .label{font-size:clamp(9px,min(3.2vw,3.4vh),12px);letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
  .big{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:clamp(40px,min(22vw,26vh),112px);line-height:1}
  .sub{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:clamp(14px,min(5.4vw,6vh),24px)}
  .bar{width:min(70vw,260px);height:6px;border-radius:3px;background:var(--track);overflow:hidden;margin-top:min(1vh,6px)}
  .fill{height:100%;background:var(--accent);border-radius:3px;width:0;transition:width 1s ease}
  .date{font-size:clamp(9px,min(3.2vw,3.4vh),12px);letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
  .coin{width:clamp(18px,min(7vw,7vh),30px);color:var(--gold)}
</style>
</head>
<body>
<main class="card" id="card">
  <svg class="coin" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="1.8"></circle><text x="16" y="21.5" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="currentColor">$</text></svg>
  <p class="label" id="label">next payday</p>
  <p class="big" id="big">–</p>
  <p class="sub" id="sub"></p>
  <div class="bar" aria-hidden="true"><div class="fill" id="fill"></div></div>
  <p class="date" id="date"></p>
</main>
<script>
  var q=new URLSearchParams(location.search);
  var th=(q.get('theme')||'sage').toLowerCase(); if(['ivory','pink','rose','night'].indexOf(th)>-1) document.body.className=th;
  var bg=(q.get('bg')||'').replace(/[^0-9a-fA-F]/g,''); if(bg.length===6||bg.length===3) document.body.style.background='#'+bg;
  if(q.get('frame')==='arch') document.getElementById('card').classList.add('arch');
  var lang=q.get('lang')==='es'?'es':'en';
  var T={en:{label:'next payday',days:'days until payday',day:'day until payday',today:"it's payday!",todayBig:'💸',month:'of the way there'},
         es:{label:'próximo cobro',days:'días para cobrar',day:'día para cobrar',today:'¡hoy cobras!',todayBig:'💸',month:'del camino'}}[lang];
  document.getElementById('label').textContent=T.label;
  var type=(q.get('type')||'monthly'), shift=(q.get('weekend')||'prev');
  function dim(y,m){return new Date(y,m+1,0).getDate()}
  function onDay(y,m,d){var n=(d==='last')?dim(y,m):Math.min(parseInt(d,10)||1,dim(y,m));return new Date(y,m,n)}
  function adj(dt){var w=dt.getDay(); if(shift==='prev'){if(w===6)dt.setDate(dt.getDate()-1);if(w===0)dt.setDate(dt.getDate()-2);} else if(shift==='next'){if(w===6)dt.setDate(dt.getDate()+2);if(w===0)dt.setDate(dt.getDate()+1);} return dt}
  function candidates(today){var out=[],y=today.getFullYear(),m=today.getMonth();
    if(type==='biweekly'){var a=(q.get('anchor')||'2026-11-06').split('-').map(Number),an=new Date(a[0],a[1]-1,a[2]);var k=Math.floor((today-an)/86400000/14);for(var i=k-2;i<=k+2;i++){var dd=new Date(an);dd.setDate(an.getDate()+i*14);out.push(adj(dd))}}
    else{for(var o=-2;o<=2;o++){var mm=new Date(y,m+o,1);var days=type==='semimonthly'?[q.get('d1')||'1',q.get('d2')||'15']:[q.get('day')||'25'];days.forEach(function(d){out.push(adj(onDay(mm.getFullYear(),mm.getMonth(),d)))})}}
    return out.sort(function(a,b){return a-b})}
  function render(){
    var n=new Date(), today=new Date(n.getFullYear(),n.getMonth(),n.getDate()), c=candidates(today);
    var next=c.filter(function(d){return d>=today})[0], prev=c.filter(function(d){return d<today}).pop();
    var diff=Math.round((next-today)/86400000), big=document.getElementById('big'), sub=document.getElementById('sub');
    if(diff===0){big.textContent=T.todayBig;sub.textContent=T.today;document.getElementById('fill').style.width='100%';}
    else{big.textContent=diff;sub.textContent=diff===1?T.day:T.days;var span=Math.round((next-prev)/86400000)||1;document.getElementById('fill').style.width=Math.max(4,Math.round((span-diff)/span*100))+'%';}
    document.getElementById('date').textContent=next.toLocaleDateString(lang==='es'?'es-ES':'en-US',{weekday:'long',month:'long',day:'numeric'});
  }
  render(); setInterval(render,3600000);
</script>
</body>
</html>
